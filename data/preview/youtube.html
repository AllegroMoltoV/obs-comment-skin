<!doctype html>
<!--
  コメント欄の着せ替え / Comment Skin のドックに表示する、YouTube のチャットの見本。
  生成した CSS を試せるよう、YouTube のポップアウトのチャットと同じ要素名と ID で組んでいる。
  土台の見た目は本プラグインのために書いたもので、YouTube の CSS は使っていない。
  外部の資源を読み込まないよう、CSP ですべての通信を禁じている。
-->
<html lang="ja" dark>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>Comment Skin preview</title>
<style>
  /* 透明な部分が分かるよう、背景を市松模様にする */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: repeating-conic-gradient(#cccccc 0 25%, #ffffff 0 50%) 0 0 / 16px 16px; }
  body { font-family: Roboto, Arial, sans-serif; }
  yt-live-chat-renderer { display: flex; flex-direction: column; height: 100%; background-color: #0f0f0f; color: #fff; }
  yt-live-chat-header-renderer { display: flex; align-items: center; flex: none; height: 40px; padding: 0 16px; background-color: #0f0f0f; border-bottom: 1px solid #303030; font-size: 14px; color: #f1f1f1; }
  #ticker { display: flex; flex: none; gap: 6px; padding: 6px 12px; overflow: hidden; }
  .ticker-item { display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 12px; font-size: 12px; white-space: nowrap; }
  .ticker-item i { width: 20px; height: 20px; border-radius: 50%; }
  #item-scroller { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 0; }
  yt-live-chat-text-message-renderer { display: flex; align-items: flex-start; padding: 4px 24px; font-size: 14px; }
  yt-img-shadow#author-photo { flex: none; width: 24px; height: 24px; margin-right: 16px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #fff; }
  #content { min-width: 0; line-height: 20px; }
  yt-live-chat-text-message-renderer #timestamp { display: none; margin-right: 8px; font-size: 11px; color: #aaa; }
  yt-live-chat-author-chip { margin-right: 8px; }
  #author-name { font-weight: 500; color: #aaa; }
  #author-name.member { color: #2ba640; }
  #author-name.moderator { color: #5e84f1; }
  #author-name.owner { padding: 0 4px; border-radius: 2px; background-color: #ffd600; color: #111; }
  #chat-badges svg { width: 14px; height: 14px; margin-left: 2px; vertical-align: -2px; }
  #message { font-size: 14px; line-height: 20px; color: #fff; word-wrap: break-word; }
  yt-live-chat-paid-message-renderer, yt-live-chat-membership-item-renderer { display: block; margin: 4px 24px; border-radius: 4px; overflow: hidden; font-size: 14px; }
  yt-live-chat-paid-message-renderer #header, yt-live-chat-membership-item-renderer #header { display: flex; align-items: center; padding: 8px 16px; }
  yt-live-chat-paid-message-renderer yt-img-shadow#author-photo, yt-live-chat-membership-item-renderer yt-img-shadow#author-photo { width: 40px; height: 40px; }
  yt-live-chat-paid-message-renderer #author-name, yt-live-chat-membership-item-renderer #author-name { display: block; color: rgba(255, 255, 255, 0.8); background: none; padding: 0; }
  #purchase-amount, #header-subtext { display: block; font-weight: 500; font-size: 15px; }
  yt-live-chat-paid-message-renderer #header-content, yt-live-chat-paid-message-renderer #header-content-primary-column { display: flex; flex: 1 1 0; }
  yt-live-chat-paid-message-renderer #single-line { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 8px; }
  yt-live-chat-paid-message-renderer #header { background-color: #1565c0; }
  yt-live-chat-paid-message-renderer #content { padding: 8px 16px; background-color: #1e88e5; }
  yt-live-chat-membership-item-renderer #header, yt-live-chat-membership-item-renderer #content { background-color: #0f9d58; }
  yt-live-chat-membership-item-renderer #content { padding: 0 16px 8px; }
  yt-live-chat-paid-message-renderer #message, yt-live-chat-membership-item-renderer #message { color: #fff; }
</style>
<style id="cskin-generated"></style>
</head>
<body>
<yt-live-chat-renderer>
  <yt-live-chat-header-renderer>チャット</yt-live-chat-header-renderer>
  <div id="ticker">
    <yt-live-chat-ticker-renderer style="display: contents">
      <span class="ticker-item" style="background:#1e88e5"><i style="background:#ab47bc"></i>¥500</span>
      <span class="ticker-item" style="background:#0f9d58"><i style="background:#26a69a"></i>メンバー</span>
    </yt-live-chat-ticker-renderer>
  </div>
  <div id="item-scroller">
    <div id="items">
      <yt-live-chat-text-message-renderer author-type="">
        <yt-img-shadow id="author-photo" style="background:#8d6e63">K</yt-img-shadow>
        <div id="content">
          <span id="timestamp">20:03</span>
          <yt-live-chat-author-chip><span id="author-name">Kei</span></yt-live-chat-author-chip>
          <span id="message">Hello from overseas! 長いコメントが折り返されたときの見え方も確かめられるように、少し長めに書いています。</span>
        </div>
      </yt-live-chat-text-message-renderer>
      <yt-live-chat-text-message-renderer author-type="">
        <yt-img-shadow id="author-photo" style="background:#7e57c2">あ</yt-img-shadow>
        <div id="content">
          <span id="timestamp">20:01</span>
          <yt-live-chat-author-chip><span id="author-name">あおぞら</span></yt-live-chat-author-chip>
          <span id="message">こんばんは!今日も楽しみにしていました</span>
        </div>
      </yt-live-chat-text-message-renderer>
      <yt-live-chat-membership-item-renderer>
        <div id="card">
          <div id="header">
            <yt-img-shadow id="author-photo" style="background:#26a69a">み</yt-img-shadow>
            <div id="header-content">
              <yt-live-chat-author-chip><span id="author-name" class="member">みどりの森</span></yt-live-chat-author-chip>
              <div id="header-subtext">メンバー歴 3 か月</div>
            </div>
          </div>
          <div id="content"><div id="message">いつもありがとうございます</div></div>
        </div>
      </yt-live-chat-membership-item-renderer>
      <yt-live-chat-paid-message-renderer>
        <div id="card">
          <div id="header">
            <yt-img-shadow id="author-photo" style="background:#ab47bc">そ</yt-img-shadow>
            <div id="header-content">
              <div id="header-content-primary-column">
                <div id="single-line">
                  <div id="author-name-chip"><yt-live-chat-author-chip><span id="author-name">そらまめ</span></yt-live-chat-author-chip></div>
                  <div id="purchase-amount-column"><div id="purchase-amount">¥500</div></div>
                </div>
              </div>
            </div>
          </div>
          <div id="content"><div id="message">配信おつかれさまです!</div></div>
        </div>
      </yt-live-chat-paid-message-renderer>
      <yt-live-chat-text-message-renderer author-type="member">
        <yt-img-shadow id="author-photo" style="background:#26a69a">み</yt-img-shadow>
        <div id="content">
          <span id="timestamp">20:01</span>
          <yt-live-chat-author-chip><span id="author-name" class="member">みどりの森</span><span id="chat-badges"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#2ba640"/></svg></span></yt-live-chat-author-chip>
          <span id="message">メンバーになりました。応援しています</span>
        </div>
      </yt-live-chat-text-message-renderer>
      <yt-live-chat-text-message-renderer author-type="moderator">
        <yt-img-shadow id="author-photo" style="background:#5c6bc0">し</yt-img-shadow>
        <div id="content">
          <span id="timestamp">20:02</span>
          <yt-live-chat-author-chip><span id="author-name" class="moderator">しずく</span><span id="chat-badges"><svg viewBox="0 0 16 16"><path d="M8 1l6 3v4c0 3.5-2.6 6.3-6 7-3.4-.7-6-3.5-6-7V4z" fill="#5e84f1"/></svg></span></yt-live-chat-author-chip>
          <span id="message">リクエストはこちらのコメントで受け付けています</span>
        </div>
      </yt-live-chat-text-message-renderer>
      <yt-live-chat-text-message-renderer author-type="owner">
        <yt-img-shadow id="author-photo" style="background:#ef6c00">配</yt-img-shadow>
        <div id="content">
          <span id="timestamp">20:02</span>
          <yt-live-chat-author-chip><span id="author-name" class="owner">配信者</span></yt-live-chat-author-chip>
          <span id="message">みなさんありがとう!始めていきます</span>
        </div>
      </yt-live-chat-text-message-renderer>
    </div>
  </div>
</yt-live-chat-renderer>
</body>
</html>
